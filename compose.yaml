services:
  postgres:
    image: postgres:17-alpine
    container_name: holdpay-postgres
    environment:
      POSTGRES_DB: holdpay
      POSTGRES_USER: holdpay
      POSTGRES_PASSWORD: holdpay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: