spring:
  application:
    name: holdpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/holdpay}
    username: ${DB_USERNAME:holdpay}
    password: ${DB_PASSWORD:holdpay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoint:
    health:
      show-details: always